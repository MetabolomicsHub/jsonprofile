repos:
- repo: https://github.com/abravalheri/validate-pyproject
  rev: 'v0.27'
  hooks:
  - id: validate-pyproject
    files: ^python/pyproject\.toml$
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
    args: [ "--maxkb=2000" ]
    exclude: '^shared/fixtures/.+\.json$|^python/docs/(ELIXIR-CM-MetabolomicsHub \(1\)\.pptx|JsonProfile-Python-Guide\.pptx)$'
  - id: check-toml
  - id: check-json
    exclude: .vscode/.+
  - id: check-yaml
    args:
    - --unsafe
  - id: end-of-file-fixer
  - id: trailing-whitespace
    exclude: "tests/data/.+"
- repo: https://github.com/lk16/detect-missing-init
  rev: v0.1.6
  hooks:
  - id: detect-missing-init
    args: [ "--create", "--track", "--python-folders", "python/src/jsonprofile" ]
    files: ^python|examples/python/src/.+\.py$
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.13.6
  hooks:
  - id: uv-lock
    args: [ "--project", "python" ]
    files: ^(python|examples/python)/(pyproject\.toml|uv\.lock)$
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.3
  hooks:
  - id: ruff-check
    args: [ "--config=python/pyproject.toml", "--fix" ]
    files: ^(python|examples/python)/.+\.py$
  - id: ruff-format
    args: [ "--config=python/pyproject.toml" ]
    files: ^(python|examples/python)/.+\.py$
- repo: local
  hooks:
  - id: spotless-format
    name: Format Java with Spotless
    entry: just format-java
    language: system
    pass_filenames: false
    files: ^(java|examples/java)/src/.+\.java$
  - id: java-lint
    name: Check Java formatting and style
    entry: just lint-java
    language: system
    pass_filenames: false
    files: ^(java|examples/java)/src/.+\.java$
  - id: cargo-fmt
    name: Format Rust with rustfmt
    entry: just format-rust
    language: system
    pass_filenames: false
    files: ^(rust|examples/rust)/.+\.rs$
  - id: rust-lint
    name: Check Rust formatting and lint
    entry: just lint-rust
    language: system
    pass_filenames: false
    files: ^(rust|examples/rust)/.+\.rs$
- repo: https://github.com/commitizen-tools/commitizen
  rev: v4.19.3
  hooks:
  - id: commitizen
    stages: [ commit-msg ]
  - id: commitizen-branch
    stages: [ pre-push ]
