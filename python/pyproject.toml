[project]
name = "jsonprofile"
version = "0.2.1"
description = "Dynamic profile management for json files share same schema"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bioregistry>=0.13.67",
    "cachetools>=7.2.8",
    "email-validator>=2.3.0",
    "httpx2>=2.14.0",
    "jsonpath-ng>=1.8.0",
    "jsonschema-rs>=0.60.3",
    "ontology-lookup>=0.1.1",
    "orjson>=3.13.0",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
    "rfc3986>=2.0.0",
]
[project.urls]
'Repository' = 'https://github.com/MetabolomicsHub/jsonprofile'

[project.optional-dependencies]
opa = ["opa-wasmtime>=0.1.1"]

[dependency-groups]
dev = [
    "pre-commit>=3.10.1",
    "commitizen>=4.13.9",
    "pytest>=9.0.3",
    "ruff>=0.17.00",
    "uv-build>=0.13.0,<0.14.0",
    "mkdocs-material>=9.7.0",
]

[tool.ruff]
target-version = "py310"
cache-dir = ".cache/ruff"
src = ["src"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$major.$minor.$patch"
version_files = [
    "pyproject.toml:version",
    "src/jsonprofile/__init__.py:__version__",
]
bump_message = "bump: version $current_version -> $new_version"
update_changelog_on_bump = true

[tool.ruff.lint]
select = ["E", "F", "C", "I", "G", "SLF", "PTH", "Q", "T"]
ignore = [ "C901"]

fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["jsonprofile"]

[tool.pytest.ini_options]
addopts = "-v"
cache_dir = ".cache/pytest"
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jsonprofile"
